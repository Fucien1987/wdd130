<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting for fun trips reservations, questions, and customer support.">
    <meta name="author" content="Kerlando Fucien">

    <title>Contact Us | White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/images-logo.png" alt="Rafting Adventure">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h2>White Water Rifting Company</h2>
            <p>123 Main River Street</p>
            <p>Kolob, Califonia</p>
            <p>Phone: +1-999-999-9999</p>
            <p>Email: info@whitewater.com</p>
        </section>
        <section class="contact-section">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d44577.71522922421!2d-113.06977583924615!3d37.
                  44308727310136!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.
                  1!3m3!1m2!1s0x80ca965e2f96f81f%3A0x9746fc1af99cd9ff!2sKolob%20Campground!5e1!3m2!1sen!2sus!4v1780676290276!5m2!1sen!2sus"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="contact-form">
                <form>
                    <label>Name</label>
                    <input type="text">

                    <label>Email</label>
                    <input type="email">

                    <p>Message Purpose</p>

                    <div class="radio-group">
                        <lebel>
                            <input type="radio" name="purpose">
                            General Inquiry
                        </lebel>

                        <label>
                            <input type="radio" name="purpose">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose">
                            Website Suggestion
                        </label>
                    </div>

                    <label>Message</label>
                    <textarea></textarea>

                    <br>
                    <label class="newsletter">
                        <input type="checkbox">
                        Please subscribe me to the monthly newsletter</label>
                    <br>

                    <button type="submit">Get in Touch</button>
                </form>
            </div>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/images-history.jpg" alt="River Guide">
                <figcaption>John Smith - River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/images-adventure2.jpg" alt="Trip Coordinator">
                <figcaption>Sarah Johnson - Trip Coordinator</figcaption>
            </figure>

            <figure>
                <img src="images/images-adventure5.jpg" alt="Safety Instructor">
                <figcaption>Mike Brown - Safety Instructor</figcaption>
            </figure>

        </section>


    </main>
    <footer>
        <p>&copy; 2026 White Water Rafting | Kerlando Fucien</p>
        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook-images.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-images.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/intagram-images.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
